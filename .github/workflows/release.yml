name: Release

# Cut a release by pushing a version tag (see `pnpm release`), or run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight release build — a half-published release is worse
  # than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize & publish (macOS)
    runs-on: macos-latest
    permissions:
      # tauri-action creates the GitHub Release and uploads assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pins pnpm via package.json#packageManager)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary — both arches so a single .app/.dmg runs on Intel
          # and Apple Silicon.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Which optional secrets exist, and — critically — export ONLY the ones
      # that do.
      #
      # The previous version of this step said tauri-action "treats an empty
      # APPLE_CERTIFICATE as don't sign, so passing empties below is safe".
      # That is not true, and a real run proved it: Tauri checks whether the
      # variable is SET, not whether it is non-empty, so an empty string sends
      # it down the signing path and it dies at
      #   security: SecKeychainItemImport: One or more parameters ... not valid
      #   failed to bundle project: failed codesign application
      # after fifteen minutes of compiling. Every release therefore had to be
      # built by hand on a developer's Mac.
      #
      # Absent secrets are now simply never exported, which is the difference
      # between "sign with nothing" and "do not sign".
      - name: Preflight — export only the signing secrets that exist
        id: preflight
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # NOT optional. Without it the updater artifacts are unsigned, every
          # installed copy rejects the update as untrusted, and auto-update
          # breaks silently for everyone — a far worse outcome than a failed
          # build, and one nobody would notice for weeks.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Publishing without it ships an update that every existing install will refuse."
            exit 1
          fi

          export_if_set() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s<<__EOF_%s\n%s\n__EOF_%s\n' "$name" "$name" "${!name}" "$name" >> "$GITHUB_ENV"
              echo "  $name: set"
            else
              echo "  $name: absent (not exported)"
            fi
          }

          echo "Apple signing inputs:"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            export_if_set "$v"
          done

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc, because the alternative is not "unsigned but fine" — it is
            # a product that cannot work. Without ANY signature the bundle has
            # no Info.plist binding and no sealed resources, so macOS has no
            # code identity to bind a TCC grant to. Measured on the 0.1.3 DMG:
            # the user granted Screen Recording and Accessibility, TCC recorded
            # both as allowed, and the requirement it stored named two cdhashes
            # that were not the installed binary's — so CGPreflightScreenCapture
            # Access() and AXIsProcessTrusted() returned false forever, through
            # any number of restarts, while System Settings showed the switches
            # on. The x86_64 slice was not signed at all.
            #
            # `-` is Tauri's documented ad-hoc pseudo-identity. It seals the
            # bundle and covers both slices, which is what TCC needs. It does
            # NOT fix Gatekeeper, and the cdhash changes every build, so a
            # customer must re-grant after each update — only a Developer ID
            # certificate gives a requirement stable across versions.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE not set — signing AD-HOC. macOS will warn on first open, and permissions must be re-granted after every update (TCC binds a grant to the exact code signature)."
          fi
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_API_KEY_P8 not set — skipping notarization."
          fi

      # The App Store Connect API key is stored base64-encoded; write it to a
      # .p8 file and expose its path for the build step.
      - name: Decode App Store Connect API key
        if: steps.preflight.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Updater signing (minisign) — signs the updater artifacts and the
          # latest.json emitted by createUpdaterArtifacts. ──
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Apple variables are deliberately NOT listed here. Naming a
          # secret in this block SETS it, empty or not, and Tauri branches on
          # "is it set" — so listing them is what turned a missing certificate
          # into a failed codesign instead of an unsigned build. The preflight
          # step exports the ones that exist, and only those.
          #
          # APPLE_API_KEY_PATH comes from the decode step above, likewise only
          # when the .p8 secret exists.
        with:
          projectPath: apps/desktop
          # For a tag push this is the tag itself; a manual dispatch falls back
          # to a run-scoped tag so the action still has something to publish to.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dispatch.{0}', github.run_number) }}
          releaseName: 'Lilypad __VERSION__'
          releaseBody: 'Download an installer below. Existing installs update automatically via the built-in updater.'
          releaseDraft: false
          prerelease: false
          # Universal binary so one artifact covers Intel + Apple Silicon.
          args: --target universal-apple-darwin

      # The one property that decides whether the product can work at all on a
      # customer's Mac, checked on the artifact rather than assumed from the
      # configuration above.
      #
      # macOS binds a TCC grant to a code requirement. A bundle with no
      # signature has no requirement to bind to, so Screen Recording and
      # Accessibility can be granted, recorded as allowed, shown as on in
      # System Settings — and still read as denied by the running process,
      # forever. That shipped in 0.1.3. Publishing an unsigned build again
      # would ship a remote-control app that can neither see the screen nor
      # move the mouse, and nothing downstream would notice.
      - name: Verify the app is signed at all
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lilypad.app"
          [ -d "$app" ] || { echo "::error::no .app at $app — nothing was bundled"; exit 1; }

          if ! codesign --verify --deep --strict "$app" 2>&1; then
            echo "::error::${app} is not validly signed. TCC cannot bind a permission grant to it, so Screen Recording and Accessibility will read as denied no matter how often the customer grants them."
            exit 1
          fi

          details=$(codesign -dvvv "$app" 2>&1)
          echo "$details"
          # Both are absent on a linker-only ad-hoc signature, which is what an
          # unsigned bundle reports, and both are what a grant is bound through.
          case "$details" in
            *"Info.plist=not bound"*)
              echo "::error::the Info.plist is not sealed into the signature — the bundle identifier TCC keys on is not bound to this code."
              exit 1 ;;
          esac
          case "$details" in
            *"Sealed Resources=none"*)
              echo "::error::no sealed resources — the bundle is not signed as a bundle, only its inner Mach-O is."
              exit 1 ;;
          esac

          # Both slices, because a universal binary with one unsigned slice is
          # a build that works on one architecture and not the other.
          for arch in x86_64 arm64; do
            codesign -dvvv --arch "$arch" "$app" >/dev/null 2>&1 \
              || { echo "::error::the $arch slice is not signed"; exit 1; }
          done

          echo "signed: $(codesign -d -r- "$app" 2>&1 | tail -1)"
