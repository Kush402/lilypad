name: Release

# Cut a release by pushing a version tag (see `pnpm release`), or run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight release build — a half-published release is worse
  # than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize & publish (macOS)
    runs-on: macos-latest
    permissions:
      # tauri-action creates the GitHub Release and uploads assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pins pnpm via package.json#packageManager)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary — both arches so a single .app/.dmg runs on Intel
          # and Apple Silicon.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Which optional secrets exist, and — critically — export ONLY the ones
      # that do.
      #
      # The previous version of this step said tauri-action "treats an empty
      # APPLE_CERTIFICATE as don't sign, so passing empties below is safe".
      # That is not true, and a real run proved it: Tauri checks whether the
      # variable is SET, not whether it is non-empty, so an empty string sends
      # it down the signing path and it dies at
      #   security: SecKeychainItemImport: One or more parameters ... not valid
      #   failed to bundle project: failed codesign application
      # after fifteen minutes of compiling. Every release therefore had to be
      # built by hand on a developer's Mac.
      #
      # Absent secrets are now simply never exported, which is the difference
      # between "sign with nothing" and "do not sign".
      - name: Preflight — export only the signing secrets that exist
        id: preflight
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # NOT optional. Without it the updater artifacts are unsigned, every
          # installed copy rejects the update as untrusted, and auto-update
          # breaks silently for everyone — a far worse outcome than a failed
          # build, and one nobody would notice for weeks.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Publishing without it ships an update that every existing install will refuse."
            exit 1
          fi

          export_if_set() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s<<__EOF_%s\n%s\n__EOF_%s\n' "$name" "$name" "${!name}" "$name" >> "$GITHUB_ENV"
              echo "  $name: set"
            else
              echo "  $name: absent (not exported)"
            fi
          }

          echo "Apple signing inputs:"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            export_if_set "$v"
          done

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc, because the alternative is not "unsigned but fine" — it is
            # a product that cannot work. Without ANY signature the bundle has
            # no Info.plist binding and no sealed resources, so macOS has no
            # code identity to bind a TCC grant to. Measured on the 0.1.3 DMG:
            # the user granted Screen Recording and Accessibility, TCC recorded
            # both as allowed, and the requirement it stored named two cdhashes
            # that were not the installed binary's — so CGPreflightScreenCapture
            # Access() and AXIsProcessTrusted() returned false forever, through
            # any number of restarts, while System Settings showed the switches
            # on. The x86_64 slice was not signed at all.
            #
            # `-` is Tauri's documented ad-hoc pseudo-identity. It seals the
            # bundle and covers both slices, which is what TCC needs. It does
            # NOT fix Gatekeeper, and the cdhash changes every build, so a
            # customer must re-grant after each update — only a Developer ID
            # certificate gives a requirement stable across versions.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE not set — signing AD-HOC. macOS will warn on first open, and permissions must be re-granted after every update (TCC binds a grant to the exact code signature)."
          fi
          # Notarization needs the WHOLE set, not any one of it. This used to
          # branch on APPLE_API_KEY_P8 alone, so setting that secret first — the
          # natural order, since one App Store Connect key serves both
          # pipelines — turned notarization "on" while the issuer id and the
          # certificate were still missing. Tauri then could not notarize,
          # published an ad-hoc build anyway, and the Gatekeeper check at the
          # end failed the release with "the notarization ticket is not
          # stapled". A true half-configuration reported as a build failure.
          #
          # APPLE_CERTIFICATE belongs in this list even though it is not passed
          # to notarytool: Apple refuses to notarize a binary that is not signed
          # with a Developer ID certificate under the hardened runtime, so
          # without it the answer is "no" regardless of the key.
          notarize_missing=()
          [ -n "${APPLE_API_KEY_P8:-}" ] || notarize_missing+=(APPLE_API_KEY_P8)
          [ -n "${APPLE_API_KEY:-}" ]    || notarize_missing+=(APPLE_API_KEY)
          [ -n "${APPLE_API_ISSUER:-}" ] || notarize_missing+=(APPLE_API_ISSUER)
          [ -n "${APPLE_CERTIFICATE:-}" ] || notarize_missing+=(APPLE_CERTIFICATE)
          if [ ${#notarize_missing[@]} -eq 0 ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "  notarization: every input present"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::skipping notarization — missing: ${notarize_missing[*]}. The build will publish ad-hoc signed, and macOS will warn on first open."
          fi

      # The gate above proves the secrets EXIST. It cannot prove Apple accepts
      # them, and every way they can be wrong — a revoked key, a mistyped
      # Issuer ID, an individual key instead of a team key, a key belonging to
      # a different Apple account than the signing certificate — surfaces only
      # after the Rust build, as a notarytool rejection about something else.
      # One signed API call settles it in about a second.
      - name: Verify Apple accepts the credentials
        if: steps.preflight.outputs.notarize == 'true'
        env:
          # Desktop only. The Mac app needs a Developer ID certificate and the
          # notary service; it does not need a TestFlight app record, and
          # failing a signed release over one would be a lie.
          APPLE_CHECK_LANE: desktop
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # The iOS lane's names are checked by mobile-ios.yml, not here — a
          # desktop release must not fail because TestFlight is unconfigured.
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: node scripts/apple-preflight.mjs

      # The App Store Connect API key is stored base64-encoded; write it to a
      # .p8 file and expose its path for the build step.
      - name: Decode App Store Connect API key
        if: steps.preflight.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Updater signing (minisign) — signs the updater artifacts and the
          # latest.json emitted by createUpdaterArtifacts. ──
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Apple variables are deliberately NOT listed here. Naming a
          # secret in this block SETS it, empty or not, and Tauri branches on
          # "is it set" — so listing them is what turned a missing certificate
          # into a failed codesign instead of an unsigned build. The preflight
          # step exports the ones that exist, and only those.
          #
          # APPLE_API_KEY_PATH comes from the decode step above, likewise only
          # when the .p8 secret exists.
        with:
          projectPath: apps/desktop
          # For a tag push this is the tag itself; a manual dispatch falls back
          # to a run-scoped tag so the action still has something to publish to.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dispatch.{0}', github.run_number) }}
          releaseName: 'Lilypad __VERSION__'
          releaseBody: 'Download an installer below. Existing installs update automatically via the built-in updater.'
          releaseDraft: false
          prerelease: false
          # Universal binary so one artifact covers Intel + Apple Silicon.
          args: --target universal-apple-darwin

      # Tauri notarizes and staples the .app, then wraps it in a DMG it never
      # submits. The DMG is the file a customer downloads, and Gatekeeper checks
      # the container first — so a stapled app inside an unstapled DMG still has
      # to phone Apple on first open, and warns outright on a machine that is
      # offline or behind a filtering network. Verified on v0.1.7:
      #
      #   Lilypad.app: accepted / source=Notarized Developer ID   (stapled)
      #   Lilypad_0.1.7_universal.dmg does not have a ticket stapled to it.
      #
      # Submitting the DMG is fast — its contents are already notarized, so
      # Apple is only ticketing the container — and the asset is re-uploaded
      # over the one tauri-action already published.
      - name: Notarize and staple the DMG itself
        if: steps.preflight.outputs.notarize == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dispatch.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no DMG was built — nothing to staple"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "submitting $(basename "$dmg")"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            # --clobber, because tauri-action uploaded the unstapled one first.
            gh release upload "$TAG" "$dmg" --clobber
          done

      # The one property that decides whether the product can work at all on a
      # customer's Mac, checked on the artifact rather than assumed from the
      # configuration above.
      #
      # macOS binds a TCC grant to a code requirement. A bundle with no
      # signature has no requirement to bind to, so Screen Recording and
      # Accessibility can be granted, recorded as allowed, shown as on in
      # System Settings — and still read as denied by the running process,
      # forever. That shipped in 0.1.3. Publishing an unsigned build again
      # would ship a remote-control app that can neither see the screen nor
      # move the mouse, and nothing downstream would notice.
      - name: Verify the app is signed at all
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lilypad.app"
          [ -d "$app" ] || { echo "::error::no .app at $app — nothing was bundled"; exit 1; }

          if ! codesign --verify --deep --strict "$app" 2>&1; then
            echo "::error::${app} is not validly signed. TCC cannot bind a permission grant to it, so Screen Recording and Accessibility will read as denied no matter how often the customer grants them."
            exit 1
          fi

          details=$(codesign -dvvv "$app" 2>&1)
          echo "$details"
          # Both are absent on a linker-only ad-hoc signature, which is what an
          # unsigned bundle reports, and both are what a grant is bound through.
          case "$details" in
            *"Info.plist=not bound"*)
              echo "::error::the Info.plist is not sealed into the signature — the bundle identifier TCC keys on is not bound to this code."
              exit 1 ;;
          esac
          case "$details" in
            *"Sealed Resources=none"*)
              echo "::error::no sealed resources — the bundle is not signed as a bundle, only its inner Mach-O is."
              exit 1 ;;
          esac

          # Both slices, because a universal binary with one unsigned slice is
          # a build that works on one architecture and not the other.
          for arch in x86_64 arm64; do
            codesign -dvvv --arch "$arch" "$app" >/dev/null 2>&1 \
              || { echo "::error::the $arch slice is not signed"; exit 1; }
          done

          echo "signed: $(codesign -d -r- "$app" 2>&1 | tail -1)"

      # Signing is the input. Notarization is the OUTCOME, and only the outcome
      # decides what a customer sees on first open.
      #
      # The step above proves a signature exists and that both slices carry it.
      # It says nothing about whether Apple was asked to notarize, whether the
      # ticket came back, or whether it was stapled into the bundle — so a
      # release could be correctly signed with the Developer ID certificate,
      # skip or fail notarization, publish, and still show the customer the
      # unidentified-developer dialog the certificate was bought to remove.
      #
      # `stapler validate` proves the ticket is IN the bundle, which is what
      # makes a first open work for someone with no internet connection.
      # `spctl` is Gatekeeper itself, asked the same question it will be asked
      # on the customer's Mac, and it is the only one of the two that can say
      # "accepted".
      #
      # Gated on the notarize preflight: an ad-hoc build is expected to fail
      # both, and failing the release for a state the workflow already warned
      # about would be noise.
      - name: Verify Gatekeeper will actually accept it
        if: steps.preflight.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Lilypad.app"

          if ! xcrun stapler validate "$app"; then
            echo "::error::the notarization ticket is not stapled into the app. A customer opening it offline still gets the unidentified-developer dialog."
            exit 1
          fi

          # `-t install` is the assessment a downloaded app gets, which is the
          # one that matters here. Anything but "accepted" is the dialog.
          verdict=$(spctl --assess --verbose=4 --type install "$app" 2>&1 || true)
          echo "$verdict"
          case "$verdict" in
            *accepted*) ;;
            *) echo "::error::Gatekeeper does not accept this build: $verdict"; exit 1 ;;
          esac
          case "$verdict" in
            *"Notarized Developer ID"*) ;;
            *) echo "::error::accepted, but not as a notarized Developer ID build — that is what removes the warning for a stranger."; exit 1 ;;
          esac

          # The DMG is the file a customer actually downloads, and it carries
          # its own ticket. A stapled app inside an unstapled DMG still warns.
          for dmg in apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            xcrun stapler validate "$dmg" || {
              echo "::error::$dmg is not stapled — the download itself is what Gatekeeper checks first."
              exit 1
            }
          done
