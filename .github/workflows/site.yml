# Marketing site → Cloudflare Pages.
#
# Separate from `deploy.yml` on purpose: the site is static, carries no secrets,
# and cannot break a live session. It has no reason to wait behind the control
# plane's gate, and the control plane has no reason to wait behind it.
#
# Cloudflare Pages is the chosen host because its free tier does not meter
# bandwidth (docs/deployment.md, "Options considered") — a marketing page that
# gets attention should not produce a bill.
#
# `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` are set (2026-08-21) and
# this workflow deploys. It did not always: it used to skip the deploy step and
# report SUCCESS, which is worse than not existing — on 2026-08-20 the live site
# still read "Not yet released publicly" while a fix for exactly that line sat on
# `main` behind three green `site` runs. A workflow that reports success without
# deploying teaches people to trust a signal that means nothing.
#
# So it FAILS rather than skips whenever it cannot deploy, and it does not
# believe the deploy either: the two verification steps below re-fetch the live
# site and the live installer anonymously and compare bytes. That is what caught
# Cloudflare Email Obfuscation rewriting `support@takedia.com` into a
# JavaScript-only `/cdn-cgi/l/email-protection` link on the privacy page.
#
# The token needs `Cloudflare Pages: Edit` and nothing else.

name: site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/design/**'
      - '.github/workflows/site.yml'
      # The desktop version lives here, and this workflow refuses to deploy
      # unless a matching release exists — so a version bump has to re-run it.
      - 'apps/desktop/src-tauri/tauri.conf.json'
  # The site SERVES the installer, so a new release is a new site. Without this
  # the page would advertise a version whose bytes were never uploaded.
  #
  # `release: [published]` is the obvious trigger and it does NOT work here:
  # `tauri-action` creates the release with `secrets.GITHUB_TOKEN`, and GitHub
  # refuses to fire workflow events for anything that token did — a deliberate
  # loop guard. The release would appear and nothing would deploy. `workflow_run`
  # is the documented way out; it runs from the default branch, which is where
  # the version to serve lives anyway.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A failed release has no artifacts to serve, so there is nothing to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      # `gh release download` reads the release assets this site hands out.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site asserts its own claims in tests (P4) — a marketing page that
      # promises a feature the product lacks is a bug, so this gates the deploy.
      - run: pnpm --filter @lilypad/site test
      - run: pnpm --filter @lilypad/site build

      # ── The installer itself ───────────────────────────────────────────────
      #
      # GitHub Releases are not the customer's download path. They were, and
      # every asset URL there answered 404 to anyone without repo access — as
      # did the updater manifest every installed copy polls — because the
      # repository was private until 2026-08-23. It is public now and those URLs
      # would resolve, which is exactly the argument against them: reachability
      # that depends on a visibility toggle is not reachability. Releases stay
      # where they are — they are the build record — but the bytes a stranger
      # downloads are served from Cloudflare Pages, which is public regardless of
      # that setting, free of egress charges, already hosting this page, and
      # verified anonymously two steps below.
      #
      # Assets are fetched for the EXACT version in tauri.conf.json rather than
      # "latest". A page that says v0.1.3 while serving v0.1.2's bytes is the
      # same class of lie this workflow already guards against, and "latest"
      # makes it a race: `release: published` and a version-bump push both land
      # here within seconds of each other.
      - name: Stage the installer the site hands out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "site will serve v$version"

          if ! gh release view "v$version" --json tagName >/dev/null 2>&1; then
            echo "::error::the site advertises v$version but no release v$version exists. Cut it with 'pnpm release' + a tag push, or this page would offer a download that is not there."
            exit 1
          fi

          mkdir -p apps/site/dist/download
          gh release download "v$version" --dir "$RUNNER_TEMP/rel" \
            --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern 'latest.json'

          # Stable, unversioned names. The page names the version in prose; the
          # URL does not, so the download link never goes stale and the updater
          # endpoint is a fixed address for every past and future build.
          cp "$RUNNER_TEMP/rel"/*.dmg         apps/site/dist/download/Lilypad.dmg
          cp "$RUNNER_TEMP/rel"/*.app.tar.gz  apps/site/dist/download/Lilypad.app.tar.gz

          # latest.json ships with GitHub asset URLs baked in by tauri-action.
          # Rewrite them to this site. The minisign signatures cover the archive
          # bytes, not the URL, so they stay valid — the updater verifies what it
          # downloaded regardless of where it came from.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/rel/latest.json", "utf8"));
            for (const p of Object.values(m.platforms)) {
              p.url = "https://lilypadhome.takedia.com/download/Lilypad.app.tar.gz";
            }
            fs.writeFileSync("apps/site/dist/download/latest.json", JSON.stringify(m, null, 2));
          '

          # Cloudflare Pages refuses any single file over 25 MiB.
          for f in apps/site/dist/download/*; do
            bytes=$(wc -c < "$f")
            printf '  %-28s %s bytes\n' "$(basename "$f")" "$bytes"
            if [ "$bytes" -gt 26214400 ]; then
              echo "::error::$(basename "$f") is $bytes bytes — over Cloudflare Pages' 25 MiB per-file limit. Move downloads to R2 before this can ship."
              exit 1
            fi
          done

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${TOKEN:-}" ] && [ -n "${ACCOUNT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          missing=""
          [ -z "${TOKEN:-}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${ACCOUNT:-}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ "${{ github.event_name }}" = "push" ]; then
            # A push to main means "publish this". Saying "success" while
            # publishing nothing is the failure mode this replaces.
            echo "::error::cannot deploy the site —$missing not set. The site on lilypadhome.takedia.com is NOT tracking main. Create a Cloudflare API token scoped to 'Cloudflare Pages: Edit' and add both as repository secrets."
            exit 1
          fi
          echo "::warning::$missing not set — built and tested, not deployed."

      - name: Confirm the deploy actually published this commit
        if: steps.creds.outputs.present == 'true'
        run: echo "deploying $(git rev-parse --short HEAD) to lilypad-site"

      # Wrangler invoked directly, NOT via `cloudflare/wrangler-action`.
      #
      # The action inspects the repo, decides the package manager is pnpm, and
      # when it finds no local wrangler runs `pnpm add wrangler@<version>` —
      # which pnpm refuses at the root of a workspace:
      #
      #   ERR_PNPM_ADDING_TO_ROOT  Running this command will add the dependency
      #   to the workspace root ... run this command again with the -w flag
      #
      # That is what the first run with real credentials died on, after the
      # secrets had already been accepted. The action offers no way to pass
      # `-w`, so the choice is to add wrangler as a root devDependency — 40 MB
      # that every other CI job would then install for a tool only this one
      # step uses — or to stop asking it to install anything. `pnpm dlx` fetches
      # it into a temp directory, touches neither the workspace nor the
      # lockfile, and is one line.
      #
      # Pinned, because `pages deploy` is the last step before a live site and
      # a floating major is a change nobody reviewed. Wrangler reads
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from the environment
      # itself, so the secrets are never interpolated into a command line.
      #
      # `--branch` is explicit rather than inferred. Wrangler reads the branch
      # from the CI environment, and any branch that is not the project's
      # PRODUCTION branch publishes a PREVIEW deployment instead — which gets
      # its own hashed URL, leaves lilypadhome.takedia.com untouched, and
      # reports success. That is the same "green but not deployed" failure this
      # workflow was rewritten to stop telling, wearing a different hat.
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@3.90.0 pages deploy apps/site/dist \
            --project-name=lilypad-site --branch=main

      # The deploy step succeeding means Cloudflare accepted an upload. It does
      # not mean the site people visit changed — a preview deployment, a custom
      # domain attached to a different project, or a stale cache all look
      # identical from here. So this fetches the real address and compares it
      # to the exact file that was just built.
      #
      # Byte-for-byte, because a semantic check ("does it still say
      # unreleased?") passes just as happily on last month's deployment.
      - name: Verify the live site is serving this build
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          expected=$(shasum -a 256 apps/site/dist/index.html | cut -d' ' -f1)
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsSL --max-time 20 https://lilypadhome.takedia.com/ \
              | shasum -a 256 | cut -d' ' -f1) || live="unreachable"
            if [ "$live" = "$expected" ]; then
              echo "lilypadhome.takedia.com is serving this build ($expected)"
              exit 0
            fi
            echo "attempt $attempt: live=$live expected=$expected — waiting"
            sleep 10
          done
          echo "::error::the deploy reported success but https://lilypadhome.takedia.com/ is not serving this build. Likely causes, in order: the Pages project's production branch is not 'main' (so this published a preview); lilypadhome.takedia.com is a custom domain on a different Pages project; or the zone transforms HTML (auto-minify, Rocket Loader), which would make a byte comparison the wrong check."
          exit 1

      # The page rendering is not the product; the installer is. This fetches it
      # the way a stranger would — no token, no cookie, no gh — and compares
      # bytes with what was uploaded. The previous arrangement passed every
      # check this workflow had while handing every visitor a 404, because
      # nothing ever tried the download itself.
      - name: Verify a stranger can actually download it
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          base=https://lilypadhome.takedia.com

          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base/download/Lilypad.dmg") || code=000
            [ "$code" = "200" ] && break
            echo "attempt $attempt: /download/Lilypad.dmg -> $code — waiting"
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::the download link answers $code to an anonymous request"; exit 1; }

          expected=$(shasum -a 256 apps/site/dist/download/Lilypad.dmg | cut -d' ' -f1)
          live=$(curl -fsSL "$base/download/Lilypad.dmg" | shasum -a 256 | cut -d' ' -f1)
          [ "$live" = "$expected" ] || { echo "::error::the served installer differs from the one built ($live != $expected)"; exit 1; }
          echo "installer verified: $expected"

          # The updater manifest, and the archive it names — the path every
          # already-installed copy takes. A 404 here breaks updates silently for
          # everyone and shows as "Update check failed" in the app.
          manifest=$(curl -fsSL "$base/download/latest.json")
          echo "$manifest" | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const urls = Object.values(m.platforms).map((p) => p.url);
            if (urls.some((u) => u.includes("github.com"))) {
              console.error("latest.json still points at the private repo: " + urls.join(", "));
              process.exit(1);
            }
            console.log("manifest v" + m.version + " -> " + [...new Set(urls)].join(", "));
          '
          archive=$(echo "$manifest" | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(Object.values(m.platforms)[0].url)')

          # A status code proves nothing on this host. Cloudflare Pages serves
          # the SPA fallback — HTTP 200, content-type text/html — for every path
          # it does not have, so `/download/anything-at-all.tar.gz` answers 200
          # exactly like a real asset. Measured 2026-08-21. A status-only check
          # here would stay green while every installed copy's updater silently
          # fetched an HTML page.
          #
          # So compare the bytes, the same way the installer above does. The
          # archive was just built into dist/, so the hash is right there.
          expected_archive=$(shasum -a 256 apps/site/dist/download/Lilypad.app.tar.gz | cut -d' ' -f1)
          live_archive=$(curl -fsSL "$archive" | shasum -a 256 | cut -d' ' -f1) || live_archive=none
          [ "$live_archive" = "$expected_archive" ] || {
            echo "::error::latest.json names $archive, but the bytes served there are not the archive that was built ($live_archive != $expected_archive)"
            exit 1
          }
          echo "update archive verified: $expected_archive"

          # A control, so a green run cannot mean "the check cannot fail".
          # If a path that certainly does not exist looks like a real download,
          # the two assertions above are worthless and must not be trusted.
          missing=$(curl -s -o /dev/null -w '%{content_type}' -L "$base/download/definitely-not-a-real-asset.tar.gz") || missing=unknown
          case "$missing" in
            text/html*) echo "control ok: a missing asset is distinguishable ($missing)" ;;
            *) echo "::error::a nonexistent download answered content-type '$missing' — this host no longer behaves as the checks above assume"; exit 1 ;;
          esac
