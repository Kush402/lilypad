name: Mobile — iOS (TestFlight)

# Decoupled from the desktop `v*` release tags: mobile ships on its own
# `mobile-v*` tags plus manual dispatch.
#
# Both triggers are somebody deliberately saying "ship this". So a run that
# cannot ship FAILS, and says which secret is missing.
#
# It used to end GREEN when signing secrets were absent, on the reasoning that
# an unconfigured platform should not look broken. That is the same false
# signal `site.yml` was rewritten to stop giving: a `mobile-v1.0.0` tag that
# reports success while uploading nothing teaches people to trust a green check
# that means nothing. It also never worked — every step but one was gated on
# the preflight, and the ungated one wrote the .p8 into `apps/mobile`, a
# directory that does not exist when checkout is skipped. The job would have
# gone red on a missing directory while its own log said "Ending green".
# Neither mobile workflow had ever run, so nobody found out.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    # An iOS archive plus a TestFlight upload is minutes, not hours. Anything
    # past this is stuck, and a stuck job that can run for six hours is a job
    # nobody can reason about during a release.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named individually rather than as "signing is not configured", because
      # the remedy differs per secret and finding out which one is missing
      # should not require reading this file.
      - name: Require the App Store Connect credentials
        id: creds
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ]    || missing+=(ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(ASC_ISSUER_ID)
          [ -n "$ASC_KEY_P8" ]    || missing+=(ASC_KEY_P8)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::not configured: ${missing[*]}. Create an App Store Connect API key (Users and Access → Integrations → App Store Connect API, role: App Manager), then set ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8 (the .p8 file, base64-encoded). See docs/apple-setup.md."
            exit 1
          fi
          echo "App Store Connect credentials present"

          # The `secrets` context is NOT available in a step-level `if`, so
          # asking "is the certificate configured?" there silently answers no
          # and skips the step forever. An output is the supported route.
          if [ -n "${IOS_DIST_CERT_P12:-}" ]; then
            echo "signing=explicit" >> "$GITHUB_OUTPUT"
          else
            echo "signing=automatic" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The step above proves the secrets exist. This asks Apple whether they
      # work, and whether the app record `upload_to_testflight` needs actually
      # exists — before an archive that takes tens of minutes to find out.
      # Dependency-free, so it runs before the install.
      - name: Verify Apple accepts the credentials
        working-directory: ${{ github.workspace }}
        env:
          APPLE_CHECK_LANE: ios
          APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/apple-preflight.mjs

      - name: Enable corepack (pins pnpm via package.json#packageManager)
        run: corepack enable
        working-directory: ${{ github.workspace }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Write App Store Connect API key (.p8)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ios/fastlane
          # `--decode` on garbage exits non-zero rather than writing a file that
          # fails later inside fastlane with a message about JWTs.
          printf '%s' "$ASC_KEY_P8" | base64 --decode > ios/fastlane/AuthKey.p8
          grep -q 'BEGIN PRIVATE KEY' ios/fastlane/AuthKey.p8 || {
            echo "::error::ASC_KEY_P8 did not decode to a PKCS#8 private key. It must be the .p8 file's bytes, base64-encoded (base64 -i AuthKey_XXXX.p8)."
            exit 1
          }
          chmod 600 ios/fastlane/AuthKey.p8
          echo "ASC_KEY_P8_PATH=$(pwd)/ios/fastlane/AuthKey.p8" >> "$GITHUB_ENV"

      # Xcode's managed cloud signing needs a role this App Store Connect key
      # does not have — it fails at export with "Cloud signing permission
      # error / No signing certificate iOS Distribution found". A certificate
      # and profile issued through the API and handed in as secrets avoid it,
      # and are deterministic besides: an ephemeral runner cannot reuse a
      # certificate whose private key it does not have, so cloud-less automatic
      # signing would mint a fresh one every run until the account hit its
      # limit.
      #
      # Optional. Without these three the lane falls back to automatic signing,
      # which is correct for an account whose key may create cloud certificates.
      - name: Install the distribution identity
        if: steps.creds.outputs.signing == 'explicit'
        working-directory: ${{ github.workspace }}
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          for v in IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::IOS_DIST_CERT_P12 is set but $v is not. All three are needed together."
              exit 1
            fi
          done

          # A dedicated keychain, not the login one: the runner's default
          # keychain is shared with everything else the job does, and this one
          # is deleted in the cleanup step whatever happens.
          keychain="$RUNNER_TEMP/lilypad-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without this codesign blocks on a GUI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*Distribution.*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::the .p12 imported but contains no distribution identity"; exit 1; }
          echo "IOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"

          echo "signing as: $identity"
          echo "profile:    $name ($uuid)"

      # The pod sandbox, keyed on the lockfile that determines it. This is
      # here for correctness before speed: `pod install` fails intermittently
      # in pnpm monorepos with CocoaPods' `ArgumentError - pathname contains
      # null byte` (CocoaPods #12798, #12866, both open upstream) at roughly
      # one run in two, and retrying is not a cure — run 32808340942 lost all
      # three of its attempts to it. A cache hit means the command that flakes
      # does not run at all, which is the only reliable way to stop losing.
      - name: Cache the CocoaPods sandbox
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      # Five attempts on a cache miss. At ~50% each that is ~3% rather than the
      # ~12% three attempts left, and a genuinely broken Podfile still fails
      # the build rather than spinning forever.
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: |
          set -uo pipefail
          # The same question Xcode's own "[CP] Check Pods Manifest.lock" phase
          # asks, and the same one the beta lane asks: is the sandbox already
          # the one this lockfile describes?
          if [ -f Pods/Manifest.lock ] && cmp -s Pods/Manifest.lock Podfile.lock; then
            echo "Pods restored from cache and match Podfile.lock — skipping install"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            echo "pod install (attempt $attempt/5)"
            if bundle exec pod install; then
              echo "pod install succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::pod install failed on attempt $attempt — retrying"
            sleep 5
          done
          echo "::error::pod install failed five times — this is not the known intermittent failure"
          exit 1

      - name: Fastlane beta (archive → IPA → TestFlight)
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # ASC_KEY_P8_PATH is exported into $GITHUB_ENV by the key-write step.
          #
          # The four below are OPTIONAL overrides, and an unset GitHub secret
          # interpolates to the empty string rather than to nothing. `Appfile`
          # and `Fastfile` therefore treat blank as absent — `"" || "default"`
          # is `""` in Ruby, so passing an uncreated secret used to replace the
          # team id and app identifier with empty strings.
          # Desktop notarization and iOS TestFlight do not have to belong to
          # the same Apple team — they already read separate App Store Connect
          # keys (APPLE_API_* vs ASC_*), and this was the last value forcing
          # them together. A Developer ID certificate needs no app record, so
          # the Mac app can ship from a team whose Account Holder you are,
          # while iOS ships from wherever the app record lives.
          #
          # Unset secrets interpolate to "", and "" || x is x in GitHub
          # expressions, so APPLE_TEAM_ID stays the default for the common case.
          APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID || secrets.APPLE_TEAM_ID }}
          IOS_APP_IDENTIFIER: ${{ secrets.IOS_APP_IDENTIFIER }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Exported by "Install the distribution identity"; absent when that
          # step is skipped, which is what selects automatic signing.
          IOS_SIGNING_IDENTITY: ${{ env.IOS_SIGNING_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ env.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane ios beta

      # `xcbeautify` prints a tidy one-line summary per build phase and DROPS
      # the output of any script phase that fails — so "PhaseScriptExecution
      # Bundle React Native code and images ... failed" arrives with no reason
      # attached, and the only way to learn one is another twenty-minute run.
      # gym keeps the raw log; this hands it over when, and only when, it is
      # needed.
      - name: Show the raw build log if the archive failed
        if: failure()
        run: |
          log=~/Library/Logs/gym/LilypadMobile-LilypadMobile.log
          if [ -f "$log" ]; then
            echo "── last 400 lines of $log ─────────────────────────────"
            tail -400 "$log"
          else
            echo "no gym log at $log — the failure was before the archive"
            ls -la ~/Library/Logs/gym 2>/dev/null || true
          fi

      # The .p8 is a credential that can upload builds to this account. The
      # runner is ephemeral, but a cached bundler step or an artifact upload
      # added later would not know that.
      - name: Shred the API key and the signing keychain
        if: always()
        run: |
          rm -f ios/fastlane/AuthKey.p8
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
