# Production deploy for the Lilypad control plane.
#
# Gate first, deploy second, verify third. The gate is the same one `ci.yml`
# runs on every push — repeated here rather than assumed, because a deploy that
# trusts a green check from an older commit is how untested code reaches
# production.
#
# Manual dispatch by default. Nothing deploys because a branch moved; a human
# (or a tag) decides.
#
# The host holds NO git checkout. It did not have one, and the earlier version
# of this workflow began with `git fetch && git checkout` in `$DEPLOY_PATH`,
# which meant it could never have succeeded even after its image tag was fixed.
# The only file the host needs from the repo is the compose file, so this
# copies exactly that — one artifact, from the commit being deployed, with no
# second copy of the repo to drift out of date.

name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
  push:
    tags: ['v*']

concurrency:
  # Never let two deploys race onto one VM.
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # GHCR rejects any tag whose repository part is not lowercase, and
  # `repository_owner` is the account's display casing — "Kush402" here — so
  # this interpolated straight into an invalid tag and every deploy run failed
  # at `docker buildx` with "repository name must be lowercase". The workflow
  # had therefore never once deployed; production was reached by hand each
  # time. There is no expression-level `lower()` in workflow syntax, so the
  # lowercasing happens in a step below and lands in $GITHUB_ENV.
  IMAGE_NAME: lilypad-backend

jobs:
  # A deploy that dies 20 minutes in because a secret was never set is
  # indistinguishable, from the outside, from a deploy that broke production.
  # Check the inputs first, in seconds, and name the missing one.
  preflight:
    name: required secrets are present
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly on a missing secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH HEALTH_URL; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::not configured: ${missing[*]} — see docs/deployment.md"
            exit 1
          fi
          echo "all deploy inputs present"

  gate:
    name: test · typecheck · lint · build · docs · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm format:check
      # Blocking: a known-vulnerable dependency must not reach production
      # silently. The two suppressed advisories, and why, are in
      # docs/deployment.md § "Dependency audit exceptions" — an ignore with no
      # written reason is indistinguishable from one added to go green.
      - run: pnpm audit --audit-level high

  image:
    name: build and push image
    needs: [preflight, gate]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute a GHCR-legal image reference
        # `${OWNER,,}` is bash lowercasing; GHCR requires it and workflow
        # expressions cannot do it.
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          # arm64 is not optional: the $0 tier (Oracle Ampere) is ARM, and the
          # paid fallback (Hetzner CX) is x86. One image must serve both.
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked into the image and reported by /health, so "which commit is
          # serving?" is answerable with curl instead of an SSH session.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy and health-check
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute a GHCR-legal image reference
        # Recomputed rather than passed as a job output: `$GITHUB_ENV` does not
        # cross job boundaries, and one three-line step is less machinery than
        # plumbing an output through `needs`.
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # Recorded BEFORE anything changes. The previous version of this step
      # rolled back to `${IMAGE}:latest` — the tag the image job had just moved
      # onto the broken build — so "rollback" redeployed the exact image whose
      # health check had failed. A rollback target has to be captured, not
      # assumed.
      - name: Record the image currently serving
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            # Written to a file on the HOST rather than returned as a step
            # output: the rollback step is a separate SSH session either way,
            # and a file cannot be lost to a step that never ran.
            sudo docker inspect --format '{{.Config.Image}}' lilypad-prod-backend-1               > "$DEPLOY_PATH/.previous-image" 2>/dev/null               || : > "$DEPLOY_PATH/.previous-image"
            echo "previous image: $(cat "$DEPLOY_PATH/.previous-image")"

      - name: Ship the compose file for this commit
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: infra/production/docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REF,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            HOST_OVERRIDE=""
            [ -f "$DEPLOY_PATH/cloudflared-local.yml" ] && HOST_OVERRIDE="$DEPLOY_PATH/cloudflared-local.yml" || true
            compose() {
              # Three things here are each load-bearing, and each was learned
              # from a failed run rather than guessed:
              #
              # --env-file: the compose file interpolates POSTGRES_USER,
              # REDIS_PASSWORD and friends. Without it every one of them
              # resolves to the empty string and the stack comes up with no
              # credentials.
              #
              # `sudo BACKEND_IMAGE=...`, not `BACKEND_IMAGE=... sudo`: sudo
              # scrubs the environment, so the prefixed form never reached
              # docker compose at all. The image variable fell back to the
              # value sitting in .env.production and the deploy redeployed the
              # OLD image while every step reported success.
              #
              # The host override: this tunnel was created from the CLI with an
              # origin certificate, so it runs from a local config file rather
              # than the dashboard token this repo's compose file assumes.
              # Deploying without the override rewrote cloudflared's command to
              # `--token ""` and took api.takedia.com off the internet for
              # seven minutes. See infra/production/README.md.
              sudo BACKEND_IMAGE="$IMAGE_REF" docker compose \
                --env-file "$DEPLOY_PATH/.env.production" \
                -f infra/production/docker-compose.yml \
                ${HOST_OVERRIDE:+-f "$HOST_OVERRIDE"} "$@"
            }
            sudo docker pull "$IMAGE_REF"
            # Converge the stateful services FIRST, explicitly, and by name.
            #
            # This step used to be implicit and it was not doing what the
            # comment below claimed. `compose run` without `--no-deps` honours
            # `depends_on`, which means it does not merely WAIT for Postgres and
            # Redis — it brings them up, and recreates either one whose
            # definition changed. Caught in the run that shipped Redis's
            # `--maxmemory` setting: the log reads
            # `Container lilypad-prod-redis-1  Recreate` at 18:10:27, from the
            # migration line, while the line below still explained that Redis
            # was not part of what changed.
            #
            # The convenient outcome (a compose change to a dependency reaches
            # production on the next deploy) is worth keeping. Doing it as an
            # unnamed side effect of a migration is not: the same mechanism
            # would recreate Postgres, or cloudflared, on a typo. So it happens
            # here, where it is visible in the log, and `--wait` blocks until
            # both report healthy.
            compose up -d --no-deps --wait postgres redis
            # Migrations run BEFORE the new image serves traffic. Drizzle
            # migrations here are additive, so the old container tolerates the
            # new schema for the seconds between these two steps.
            #
            # `--no-deps` now that the line above has already guaranteed a
            # healthy Postgres: there is nothing left for the dependency graph
            # to do except surprise us.
            compose run --rm -T --no-deps backend node dist/db/migrate.js
            # `--no-deps backend`, not a bare `up -d`: a deploy replaces the
            # backend, and the tunnel in particular must never be churned by
            # one — recreating cloudflared from this repo's definition is what
            # took api.takedia.com off the internet for seven minutes.
            compose up -d --no-deps backend
            sudo docker image prune -f

      - name: Verify the deployment is actually serving THIS commit
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$HEALTH_URL" || true)
            # Both halves matter. "ok" alone passes when the OLD container is
            # still up and perfectly healthy, which is exactly what a failed
            # deploy looks like from the outside.
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"revision\":\"$EXPECT_SHA\""; then
              echo "healthy and serving $EXPECT_SHA: $body"; exit 0
            fi
            echo "attempt $i: ${body:-<no response>}"; sleep 5
          done
          echo "::error::deployment did not serve $EXPECT_SHA healthily within 150s"
          exit 1

      # A failed health check must not leave a broken image serving. Roll back
      # to the image that was recorded as running before this deploy started.
      - name: Roll back on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            prev=$(tr -d '\r' < "$DEPLOY_PATH/.previous-image" 2>/dev/null | tail -n1 | xargs || true)
            if [ -z "$prev" ]; then
              echo "::error::no previous image was recorded — rolling back would be a guess. Left as-is for a human."
              exit 1
            fi
            cd "$DEPLOY_PATH"
            HOST_OVERRIDE=""
            [ -f "$DEPLOY_PATH/cloudflared-local.yml" ] && HOST_OVERRIDE="$DEPLOY_PATH/cloudflared-local.yml" || true
            sudo BACKEND_IMAGE="$prev" docker compose \
              --env-file "$DEPLOY_PATH/.env.production" \
              -f infra/production/docker-compose.yml \
              ${HOST_OVERRIDE:+-f "$HOST_OVERRIDE"} up -d --no-deps backend
            echo "rolled back to $prev"
