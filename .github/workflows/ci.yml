name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Longer soak tiers (docs/audit/m3/testing-reliability.md Finding 7) —
    # deliberately NOT run on every push/PR: this class of test is slow by
    # design (real wall-clock duration) and would poison the "required
    # checks" trust model if it blocked normal development. The smoke tier
    # (~15s, tests/soak.rs's default) already runs on every push/PR for free
    # as part of the `rust` job's normal `cargo test` below.
    - cron: '0 3 * * *' # nightly 4h soak, 03:00 UTC
    - cron: '0 1 * * 0' # weekly 24h soak, Sunday 01:00 UTC
  # Re-running the full gate should not require inventing a commit. It is also
  # the only way to re-test the gate itself after something OUTSIDE the code
  # changes it — the CodeQL upload was refused for a repository-plan reason on
  # 2026-08-22 and started working again on 2026-08-23 with no diff.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend/env schema requires these to be present even though CI never
  # boots real infra — every value here is a harmless placeholder.
  NODE_ENV: test

jobs:
  typescript:
    name: TypeScript — typecheck, lint, format, test
    runs-on: ubuntu-latest

    # Postgres and Redis, matching infra/docker-compose.yml.
    #
    # CI ran with neither until 2026-08-22, which meant no test that touched
    # the database could exist — so none did, and the authorization rules that
    # ARE database rows were provable only through hand-written fakes. A fake
    # cannot prove a partial UPDATE leaves an untouched column alone
    # (`devices.app_version`), because a fake that models it is a restatement
    # of the code it is checking.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lilypad
          POSTGRES_PASSWORD: lilypad_dev_password
          POSTGRES_DB: lilypad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lilypad -d lilypad"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # The same default the code falls back to, stated here so a change to
      # either is visible as a change.
      DATABASE_URL: postgres://lilypad:lilypad_dev_password@localhost:5432/lilypad
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pins pnpm via package.json#packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Format check
        run: pnpm format:check

      # Documentation drift is treated as a build failure: this repo has shipped
      # features whose docs said "not started", and routes that existed in code
      # but nowhere in docs/api.md. See scripts/docs-check.mjs.
      - name: Docs check
        run: pnpm docs:check

      # The schema the tests run against is the migrations, not a snapshot of
      # them — so a migration that does not apply fails CI here rather than in
      # production.
      - name: Migrate the test database
        run: pnpm --filter @lilypad/backend db:migrate

      - name: Test
        run: pnpm turbo run test

      # `deviceFlow.e2e.test.ts` drives the app's REAL identity and auth code
      # against a REAL backend — genuine Ed25519 keys, the genuine wire format,
      # Redis's single-use challenge semantics, Postgres rows. It guards the
      # replay and cross-key refusals that the whole device-identity model
      # rests on.
      #
      # It skipped itself unless two env vars were set, and nothing ever set
      # them: not CI, not a script, not a package.json entry. Eleven tests had
      # never run anywhere. They pass — which is the point: a check nobody runs
      # is not a check, and this one was guarding the security boundary.
      - name: Device-identity end-to-end (real backend, real Postgres/Redis)
        run: |
          pnpm --filter @lilypad/backend build
          BACKEND_PORT=8099 node apps/backend/dist/index.js > /tmp/lilypad-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/health >/dev/null || { cat /tmp/lilypad-e2e.log; exit 1; }
          LILYPAD_E2E_BASE_URL=http://127.0.0.1:8099 \
          LILYPAD_E2E_LOG=/tmp/lilypad-e2e.log \
            pnpm --filter @lilypad/mobile exec jest src/lib/deviceFlow.e2e.test.ts

  security:
    name: Security — CodeQL + dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # CodeQL's `analyze` step calls the workflow-runs API to attach its
      # results to this run. Without this it uploads the SARIF successfully —
      # the CodeQL check goes green — and then fails the JOB on the follow-up
      # call, which is how a passing analysis produced a red build:
      #
      #   ##[error]Resource not accessible by integration -
      #   https://docs.github.com/rest/actions/workflow-runs#get-a-workflow-run
      #
      # Read-only, and scoped to Actions metadata; it grants nothing this job
      # could write with.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pins pnpm via package.json#packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING: fails the build on any high/critical advisory. Moderate and
      # below are reported by `pnpm audit` locally but do not gate CI, so a
      # noisy transitive advisory can't halt unrelated work.
      #
      # Transitive advisories whose parent already permits a patched range are
      # pinned via `pnpm.overrides` in the root package.json rather than by
      # waiting on the parent to re-release.
      #
      # Two advisories are explicitly ignored via `pnpm.auditConfig.ignoreGhsas`:
      # GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq (image-size DoS via the ICNS
      # and JXL/HEIF parsers). There is no patched release — npm reports the
      # patched range as `<0.0.0`. It reaches us only through
      # metro-config → metro, i.e. React Native's *bundler*, which runs at build
      # time over our own asset files and never ships in the app or processes
      # untrusted input. Re-evaluate when metro bumps it; do not extend this list
      # without the same reasoning written down.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  rust:
    # ScreenCaptureKit + VideoToolbox are macOS-only (see apps/desktop/src-tauri/Cargo.toml
    # target.'cfg(target_os = "macos")' deps) — the desktop crate will not compile on Linux.
    name: Rust — fmt, clippy, test (macOS)
    # apple-metal's Swift bridge references Metal APIs from Xcode 16 / macOS
    # 15 (MTLResidencySet, MTLLogState, …) — macos-14's older Xcode can't
    # compile it. macos-latest tracks a current Xcode.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  soak-nightly:
    # 4h tier: docs/audit/m3/testing-reliability.md Finding 7. Only the
    # nightly cron trigger runs this — never a push/PR, and never the same
    # run as the weekly tier below. `timeout-minutes` must exceed the soak
    # duration itself (GitHub's default job timeout is 360 minutes, which
    # would kill this run partway through otherwise).
    if: github.event.schedule == '0 3 * * *'
    name: Soak (nightly, 4h)
    runs-on: macos-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    env:
      LILYPAD_SOAK_SECS: 14400
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Soak test
        run: cargo test --test soak -- --nocapture

  soak-weekly:
    # 24h tier: docs/audit/m3/testing-reliability.md Finding 7. Same
    # timeout-minutes note as soak-nightly above — 24h exceeds GitHub's
    # default 360-minute job timeout.
    if: github.event.schedule == '0 1 * * 0'
    name: Soak (weekly, 24h)
    runs-on: macos-latest
    timeout-minutes: 1500
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    env:
      LILYPAD_SOAK_SECS: 86400
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Soak test
        run: cargo test --test soak -- --nocapture
