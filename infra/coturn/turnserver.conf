# coturn config for Lilypad local dev (STUN + TURN).
# Used from Milestone 2 onward; Milestone 1 does not exercise it.
#
# SECURITY: this uses a static dev secret. In production, switch to short-lived
# time-limited credentials (use-auth-secret with a rotated secret) and a real
# external-ip / relay range — see docs/threat-model.md.

listening-port=3478

# Realm for long-term credential auth.
realm=lilypad.local

# Time-limited credential auth (coturn REST / use-auth-secret scheme). The
# backend issues short-lived HMAC-SHA1 credentials that coturn re-derives from
# this same secret — see apps/backend/src/turn/credentials.ts. No long-lived
# password ever leaves the server. This secret MUST equal TURN_SECRET in .env.
use-auth-secret
static-auth-secret=lilypad_dev_turn_secret

# Relay port range (must match the published range in docker-compose.yml).
min-port=49160
max-port=49200

# For local dev, coturn advertises the loopback/host address. On a public
# deployment set this to the server's public IPv4, e.g. external-ip=203.0.113.10
external-ip=127.0.0.1

# Reasonable dev hardening.
no-tls
no-dtls
no-multicast-peers
no-cli
fingerprint
stale-nonce=600

# Quieter logs in dev.
log-file=stdout
simple-log
