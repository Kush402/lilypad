# ─────────────────────────────────────────────────────────────────────────────
# Lilypad PRODUCTION coturn — cellular-grade WebRTC relay.
#
# This is the fix for the "connects then reconnect/recovering loop over
# cellular" problem: the app was relaying through a free public TURN
# (metered.ca) whose DNS round-robins to different boxes and whose free tier
# can't carry a sustained 1–3 Mbps desktop stream, so the relayed path dropped
# every ~30s. A dedicated coturn on a box you control, reachable on TLS:443,
# gives ONE stable relayed hop that survives cellular NAT rebinds.
#
# The three deployment-specific values — public IP, auth secret, realm/domain —
# are injected on the command line from `.env` (see docker-compose.yml), so
# this file carries NO secrets and can be committed as-is.
#
# Auth scheme: `use-auth-secret` (coturn REST / time-limited HMAC-SHA1). The
# backend mints short-lived credentials from the SAME secret — see
# apps/backend/src/turn/credentials.ts. `static-auth-secret` (passed via env)
# MUST equal the backend's TURN_SECRET. No long-lived password ever leaves the
# server.
# ─────────────────────────────────────────────────────────────────────────────

# ── Listeners ────────────────────────────────────────────────────────────────
# Plain STUN/TURN over UDP+TCP (coturn opens both on this port).
listening-port=3478
# TURN over TLS on 443. This is the cellular winner: to a carrier's deep-packet
# inspection it is indistinguishable from HTTPS, so it passes networks that
# throttle or block UDP and non-standard ports. `turns:HOST:443?transport=tcp`.
tls-listening-port=443

# Advertise the relay candidates on the server's PUBLIC IPv4. REQUIRED — without
# it coturn hands out unreachable relay addresses. Injected via --external-ip.

# ── Auth (injected: --static-auth-secret, --realm) ───────────────────────────
use-auth-secret

# ── Relay port range ─────────────────────────────────────────────────────────
# Each active allocation uses one UDP port here. 100 ports ≈ 50 concurrent
# sessions. These UDP ports MUST be open in the VPS firewall (see README).
min-port=49160
max-port=49260

# ── TLS certificates (Let's Encrypt; see README step 4) ──────────────────────
# Mounted read-only into the container at these paths by docker-compose.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# Modern TLS only.
no-tlsv1
no-tlsv1_1
dh2066

# ── Hardening ────────────────────────────────────────────────────────────────
fingerprint
# The two clients are always reached at their PUBLIC (server-reflexive)
# addresses, so a relay has no legitimate reason to forward to private/internal
# ranges. Denying them turns this relay from a potential SSRF pivot into a
# public-internet-only relay.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# IPv4 denials above do not match IPv6 encodings of the same addresses.
# Without these, CreatePermission(::ffff:169.254.169.254) (cloud metadata),
# NAT64 64:ff9b::a9fe:a9fe, 6to4 2002:a9fe:a9fe::, or Teredo would bypass
# the SSRF list. coturn's example.conf carries the same ranges. Loopback
# is already denied unless --allow-loopback-peers (not set).
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse caps (tune as usage grows): per-user and total simultaneous allocations.
user-quota=12
total-quota=1200
# Reject a nonce after 10 min, forcing re-auth (limits credential replay).
stale-nonce=600
# No admin CLI/telnet surface.
no-cli
cli-password=disabled

# ── Logging ──────────────────────────────────────────────────────────────────
log-file=stdout
simple-log
